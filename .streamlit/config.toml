[theme]
base = "light"
primaryColor = "#0A6777"
backgroundColor = "#F7FAFC"
secondaryBackgroundColor = "#E8F0F5"
textColor = "#153047"
font = "sans serif"

[client]
# Do not show exception text or stack traces in the browser. The app explains
# expected failures itself; anything else is only logged on the server.
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
