name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Install Playwright for the browser tests
        run: python -m pip install "playwright>=1.50,<2"
      - name: Check that Chrome is available
        run: google-chrome --version
      - name: Run offline tests (logic and real Streamlit AppTest, no AWS)
        run: python -m unittest discover -s tests -v
